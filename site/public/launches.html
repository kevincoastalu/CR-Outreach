<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Launches | CyRisk Outreach</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <div id="topbarMount"></div>

    <section class="card panel">
      <div class="hub-heading">
        <h2>Launches</h2>
        <span class="info-tip" tabindex="0" role="img" aria-label="About launches" data-tip="Prepared jobs appear here. For Apollo, push creates an inactive sequence and enrolls contacts. Activate sending in Apollo.">i</span>
      </div>
      <p class="page-intro">Prepared launch jobs in one list. Expand a row to push to Apollo (inactive) or open the campaign.</p>
      <div class="hub-actions">
        <a class="primary-btn" href="index.html#prepare-launch">Prepare a launch</a>
        <a class="secondary-btn" href="campaigns.html">Browse Campaigns</a>
      </div>
      <div id="statusMessage" class="status-message" aria-live="polite"></div>
      <div id="launchList" class="stack-list"><p class="muted">Loading launch jobs...</p></div>
    </section>
  </div>

  <script src="shared.js"></script>
  <script>
    const { escapeHtml, setStatus, topbar, bindNavButtons, withButtonBusy } = window.CyRiskShared;
    document.getElementById('topbarMount').innerHTML = topbar('launches');
    bindNavButtons(document);

    const launchList = document.getElementById('launchList');
    const statusMessage = document.getElementById('statusMessage');
    let launchJobs = [];
    let openLaunchId = '';

    function jobRowId(job) {
      return job.id || `${job.campaignId}-${job.platform}`;
    }

    function renderLaunchJobs() {
      if (!launchJobs.length) {
        launchList.innerHTML = '<div class="stack-item"><div class="stack-summary" style="cursor:default;"><div class="stack-summary-main"><strong>No launch jobs yet</strong><span>Finish a campaign in the workflow, then prepare launch.</span></div></div></div>';
        return;
      }

      launchList.innerHTML = launchJobs.map((job) => {
        const id = jobRowId(job);
        const isOpen = openLaunchId === id;
        const platform = String(job.platform || '').toLowerCase();
        const status = String(job.status || '').toLowerCase();
        const sequenceId = job.payload?.apollo_sequence_id || '';
        const pushed = status === 'pushed' || Boolean(sequenceId);
        const apolloActions = platform === 'apollo'
          ? (pushed
            ? `<a class="secondary-btn" href="https://app.apollo.io/#/sequences/${encodeURIComponent(sequenceId)}" target="_blank" rel="noopener">Open in Apollo</a>`
            : `<button class="primary-btn push-apollo-btn" type="button" data-job-id="${escapeHtml(job.id || '')}">Push to Apollo (paused)</button>`)
          : (platform === 'instantly'
            ? '<span class="muted">Instantly push not wired yet</span>'
            : '');
        return `
          <article class="stack-item${isOpen ? ' is-open' : ''}" data-launch-id="${escapeHtml(id)}">
            <button class="stack-summary" type="button" data-toggle-id="${escapeHtml(id)}" aria-expanded="${isOpen ? 'true' : 'false'}">
              <div class="stack-summary-main">
                <strong>${escapeHtml(job.campaignName || 'Untitled campaign')}</strong>
                <span>${escapeHtml(job.platform || 'provider')} · ${escapeHtml(job.status || 'unknown')}</span>
              </div>
              <div class="stack-meta">
                <span class="tag">${escapeHtml(job.status || 'paused')}</span>
                <span>${job.assignedLeadCount || 0} lead${(job.assignedLeadCount || 0) === 1 ? '' : 's'}</span>
              </div>
              <span class="stack-chevron" aria-hidden="true">▼</span>
            </button>
            <div class="stack-detail">
              <p>${escapeHtml(job.objective || 'No objective set for this campaign.')}</p>
              <p><strong>Job ID:</strong> ${escapeHtml(job.id || '-')}</p>
              <p><strong>Provider:</strong> ${escapeHtml(job.platform || '-')}</p>
              <p><strong>Status:</strong> ${escapeHtml(job.status || '-')}</p>
              ${sequenceId ? `<p><strong>Apollo sequence:</strong> ${escapeHtml(sequenceId)}</p>` : ''}
              <p><strong>Next step:</strong> ${
                platform === 'apollo'
                  ? (pushed
                    ? 'Sequence is in Apollo as inactive. Activate it there when you are ready to send.'
                    : 'Push to Apollo to create an inactive sequence and enroll assigned contacts.')
                  : `Activate this send in ${escapeHtml(job.platform || 'your email provider')}.`
              }</p>
              <div class="mini-campaign-actions">
                ${apolloActions}
                ${job.campaignId ? `<a class="secondary-btn" href="index.html?campaign=${encodeURIComponent(job.campaignId)}#prepare-launch">Open campaign</a>` : ''}
                <a class="secondary-btn" href="campaigns.html">Browse Campaigns</a>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    async function pushLaunchJobToApollo(jobId) {
      if (!jobId) {
        setStatus(statusMessage, 'Missing launch job id.', 'error');
        return;
      }
      setStatus(statusMessage, 'Pushing inactive sequence to Apollo...', '');
      try {
        const response = await fetch('/.netlify/functions/push-to-apollo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ jobId })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Could not push to Apollo');
        await loadLaunches();
        setStatus(
          statusMessage,
          result.alreadyPushed
            ? `Already pushed to Apollo${result.sequenceName ? ` (“${result.sequenceName}”)` : ''}.`
            : (result.message || `Pushed ${result.enrolled || 0} contacts to Apollo (inactive).`),
          'success'
        );
      } catch (error) {
        setStatus(statusMessage, error.message || 'Could not push to Apollo.', 'error');
      }
    }

    async function loadLaunches() {
      try {
        const response = await fetch('/.netlify/functions/list-campaigns');
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Could not load launches');
        const campaigns = Array.isArray(result.campaigns) ? result.campaigns : [];
        launchJobs = campaigns.flatMap((campaign) => (campaign.send_jobs || []).map((job) => ({
          ...job,
          campaignName: campaign.name,
          campaignId: campaign.id,
          objective: campaign.objective,
          assignedLeadCount: Array.isArray(campaign.campaign_leads) ? campaign.campaign_leads.length : 0
        })));
        renderLaunchJobs();
      } catch (error) {
        setStatus(statusMessage, error.message || 'Could not load launches.', 'error');
        launchList.innerHTML = '<p class="muted">Could not load launch jobs.</p>';
      }
    }

    launchList.addEventListener('click', (event) => {
      if (event.target.closest('a[href]')) return;

      const pushBtn = event.target.closest('.push-apollo-btn');
      if (pushBtn) {
        event.preventDefault();
        withButtonBusy(pushBtn, () => pushLaunchJobToApollo(pushBtn.dataset.jobId), 'Pushing to Apollo...');
        return;
      }
      const toggle = event.target.closest('[data-toggle-id]');
      if (!toggle) return;
      const id = toggle.dataset.toggleId || '';
      openLaunchId = openLaunchId === id ? '' : id;
      renderLaunchJobs();
    });

    loadLaunches();
  </script>
</body>
</html>
