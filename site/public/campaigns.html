<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campaigns | CyRisk Outreach</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <div id="topbarMount"></div>

    <section class="card panel">
      <div class="hub-heading">
        <h2>Campaigns</h2>
        <span class="info-tip" tabindex="0" role="img" aria-label="About campaigns" data-tip="Browse every saved campaign here. Select a row to expand details. Open one in the workflow to edit copy, assign leads, or prepare launch.">i</span>
      </div>
      <p class="page-intro">Your campaign library in a compact list. Click a campaign to expand details—only one stays open at a time.</p>
      <div class="hub-actions">
        <button class="primary-btn" type="button" data-nav-href="index.html#campaigns-hub">Create new campaign</button>
        <button class="secondary-btn" type="button" data-nav-href="leads.html">Browse Leads CRM</button>
      </div>
      <div id="statusMessage" class="status-message" aria-live="polite"></div>
      <div id="campaignList" class="stack-list"></div>
    </section>
  </div>

  <script src="shared.js"></script>
  <script>
    const { escapeHtml, withButtonBusy, setStatus, topbar, bindNavButtons } = window.CyRiskShared;
    document.getElementById('topbarMount').innerHTML = topbar('campaigns');
    bindNavButtons(document);

    const campaignList = document.getElementById('campaignList');
    const statusMessage = document.getElementById('statusMessage');
    let savedCampaigns = [];
    let openCampaignId = '';

    function renderCampaignList(items) {
      savedCampaigns = items || [];
      if (!items.length) {
        campaignList.innerHTML = '<div class="stack-item"><div class="stack-summary" style="cursor:default;"><div class="stack-summary-main"><strong>No campaigns yet</strong><span>Create your first campaign in the Campaign workflow.</span></div></div></div>';
        return;
      }

      campaignList.innerHTML = items.map((campaign) => {
        const drafts = Array.isArray(campaign.email_drafts) ? campaign.email_drafts.slice(0, 3) : [];
        const preview = drafts.length
          ? drafts.map((draft) => `<p><strong>${escapeHtml(draft.subject_line || 'Draft')}</strong><br>${escapeHtml((draft.body_text || '').slice(0, 120))}${(draft.body_text || '').length > 120 ? '...' : ''}</p>`).join('')
          : '<p>No drafted copy stored yet.</p>';
        const latestJob = Array.isArray(campaign.send_jobs) && campaign.send_jobs.length ? campaign.send_jobs[0] : null;
        const assignedLeadCount = Array.isArray(campaign.campaign_leads) ? campaign.campaign_leads.length : 0;
        const isOpen = openCampaignId && openCampaignId === campaign.id;

        return `
          <article class="stack-item${isOpen ? ' is-open' : ''}" data-campaign-id="${escapeHtml(campaign.id || '')}">
            <button class="stack-summary" type="button" data-toggle-id="${escapeHtml(campaign.id || '')}" aria-expanded="${isOpen ? 'true' : 'false'}">
              <div class="stack-summary-main">
                <strong>${escapeHtml(campaign.name || 'Untitled campaign')}</strong>
                <span>${escapeHtml(campaign.target_segment || 'No audience')} · ${assignedLeadCount} lead${assignedLeadCount === 1 ? '' : 's'}</span>
              </div>
              <div class="stack-meta">
                <span class="tag">${escapeHtml(campaign.status || 'draft')}</span>
                <span>${latestJob ? `${escapeHtml(latestJob.platform)} / ${escapeHtml(latestJob.status)}` : 'Not launched'}</span>
              </div>
              <span class="stack-chevron" aria-hidden="true">▼</span>
            </button>
            <div class="stack-detail">
              <p>${escapeHtml(campaign.objective || 'No objective set.')}</p>
              <p><strong>Audience:</strong> ${escapeHtml(campaign.target_segment || 'N/A')}</p>
              <p><strong>Assigned leads:</strong> ${assignedLeadCount}</p>
              <p><strong>Launch:</strong> ${latestJob ? `${escapeHtml(latestJob.platform)} / ${escapeHtml(latestJob.status)}` : 'Not prepared'}</p>
              ${preview}
              <div class="mini-campaign-actions">
                <button class="secondary-btn" type="button" data-nav-href="index.html?campaign=${encodeURIComponent(campaign.id || '')}#campaigns-hub">Open in workflow</button>
                <button class="secondary-btn danger-btn delete-campaign-btn" type="button" data-campaign-id="${escapeHtml(campaign.id || '')}" data-campaign-name="${escapeHtml(campaign.name || 'Untitled campaign')}">Delete</button>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    async function deleteCampaign(campaignId, campaignName) {
      if (!campaignId) {
        setStatus(statusMessage, 'That campaign cannot be deleted yet because it has no saved ID.', 'error');
        return;
      }
      const confirmed = window.confirm(`Delete "${campaignName || 'this campaign'}"? Leads stay in Leads CRM, but this campaign’s copy and launch jobs will be removed.`);
      if (!confirmed) return;

      setStatus(statusMessage, 'Deleting campaign...', '');
      const response = await fetch('/.netlify/functions/delete-campaign', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ campaignId })
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || 'Could not delete campaign');
      if (openCampaignId === campaignId) openCampaignId = '';
      await loadCampaigns();
      setStatus(statusMessage, `Deleted campaign${result.name ? `: ${result.name}` : ''}.`, 'success');
    }

    async function loadCampaigns() {
      try {
        const response = await fetch('/.netlify/functions/list-campaigns');
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || 'Could not load campaigns');
        renderCampaignList(Array.isArray(result.campaigns) ? result.campaigns : []);
      } catch (error) {
        setStatus(statusMessage, error.message || 'Could not load campaigns.', 'error');
        renderCampaignList([]);
      }
    }

    campaignList.addEventListener('click', (event) => {
      const navBtn = event.target.closest('[data-nav-href]');
      if (navBtn) {
        event.preventDefault();
        window.CyRiskShared.navigateTo(navBtn.getAttribute('data-nav-href'));
        return;
      }

      const deleteButton = event.target.closest('.delete-campaign-btn');
      if (deleteButton) {
        event.stopPropagation();
        withButtonBusy(deleteButton, () => deleteCampaign(deleteButton.dataset.campaignId, deleteButton.dataset.campaignName), 'Deleting...');
        return;
      }

      const toggle = event.target.closest('[data-toggle-id]');
      if (!toggle) return;
      const id = toggle.dataset.toggleId || '';
      openCampaignId = openCampaignId === id ? '' : id;
      renderCampaignList(savedCampaigns);
    });

    loadCampaigns();
  </script>
</body>
</html>
